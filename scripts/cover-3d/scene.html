<script type=module>

{const sh2=new THREE.Shape(),w=pl[0]/2,d=pl[2]/2,c=.2;sh2.moveTo(-w+c,-d);sh2.lineTo(w-c,-d);sh2.quadraticCurveTo(w,-d,w,-d+c);sh2.lineTo(w,d-c);sh2.quadraticCurveTo(w,d,w-c,d);sh2.lineTo(-w+c,d);sh2.quadraticCurveTo(-w,d,-w,d-c);sh2.lineTo(-w,-d+c);sh2.quadraticCurveTo(-w,-d,-w+c,-d);

{const a=rig.worldToLocal(mon.localToWorld(new THREE.Vector3(0,-sh*.42,-.13))),b=new THREE.Vector3(P.foot[0],P.py+.03,P.foot[1]-.1);neck.position.copy(a.clone().add(b).multiplyScalar(.5));neck.scale.y=a.distanceTo(b);neck.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0),a.clone().sub(b).normalize());}
