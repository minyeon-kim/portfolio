<script type=module>
import * as THREE from 'three';

box(sw+bz*2+.03,sh+bz*2+.03,th,silver,-th/2-.008);box(sw+bz*2,sh+bz*2,.012,black,0);

const n=P.n,gl=r.getContext(),acc=new Float32Array(W*H*4),buf=new Uint8Array(W*H*4),rnd=(()=>{let a=7;return()=>(a=(a*16807)%2147483647)/2147483647})();
for(let i=0;i<n;i++){cam.setViewOffset(W,H,i?rnd()-.5:0,i?rnd()-.5:0,W,H);const q=()=>(rnd()-.5)*P.soft;key.position.set(P.keyp[0]+q(),P.keyp[1]+q(),P.keyp[2]+q());r.render(s,cam);gl.readPixels(0,0,W,H,gl.RGBA,gl.UNSIGNED_BYTE,buf);for(let k=0;k<buf.length;k++)acc[k]+=buf[k];if(i%8==7)await new Promise(x=>setTimeout(x));}

for(let yy=0;yy<H;yy++)for(let xx=0;xx<W;xx++){const i=((H-1-yy)*W+xx)*4,o=(yy*W+xx)*4,nz=(Math.random()-.5)*1.6;for(let k=0;k<3;k++)e[o+k]=Math.max(0,Math.min(255,acc[i+k]/n+nz));e[o+3]=255}
x.putImageData(out,0,0);x.globalCompositeOperation='destination-out';x.beginPath();corners.forEach(([a,b],i)=>{const px=a/L,py=b/L;i?x.lineTo(px,py):x.moveTo(px,py)});x.closePath();x.fill();window.DONE=true;
</script>
