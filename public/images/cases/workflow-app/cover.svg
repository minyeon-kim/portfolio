<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="800" viewBox="0 0 1600 800">
  <!-- Illustrative cover in the style of the case's token demo. TODO: replace with a Devsign screen. -->
  <rect width="1600" height="800" fill="#E9ECEA"/>
  <rect x="160" y="200" width="300" height="400" rx="6" fill="#FFFFFF" stroke="#DADFDC"/>
  <text x="190" y="248" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" fill="#5B6461">Tokens</text>
  <text x="190" y="300" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="18" fill="#0E1111">Primary color</text>
  <rect x="190" y="316" width="240" height="12" rx="6" fill="#3DD491"/>
  <text x="190" y="380" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="18" fill="#0E1111">Radius</text>
  <rect x="190" y="396" width="240" height="4" rx="2" fill="#DADFDC"/><circle cx="280" cy="398" r="10" fill="#FFFFFF" stroke="#0E1111"/>
  <text x="190" y="460" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="18" fill="#0E1111">Spacing</text>
  <rect x="190" y="476" width="240" height="4" rx="2" fill="#DADFDC"/><circle cx="250" cy="478" r="10" fill="#FFFFFF" stroke="#0E1111"/>
  <rect x="490" y="200" width="460" height="400" rx="6" fill="#FFFFFF" stroke="#DADFDC"/>
  <text x="520" y="248" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" fill="#5B6461">Preview</text>
  <rect x="520" y="290" width="200" height="52" rx="6" fill="#3DD491"/>
  <text x="550" y="323" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="20" font-weight="600" fill="#1C1C1C">Request review</text>
  <rect x="740" y="290" width="120" height="52" rx="6" fill="#FFFFFF" stroke="#DADFDC"/>
  <text x="770" y="323" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="20" fill="#0E1111">Cancel</text>
  <rect x="520" y="380" width="400" height="180" rx="6" fill="#F5F6F4" stroke="#DADFDC"/>
  <text x="548" y="424" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="20" font-weight="600" fill="#0E1111">Place order button</text>
  <text x="548" y="460" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" fill="#5B6461">Height 44px · primary color token</text>
  <rect x="980" y="200" width="460" height="400" rx="6" fill="#FFFFFF" stroke="#DADFDC"/>
  <text x="1000" y="248" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" fill="#5B6461">tokens.css</text>
  <text x="1000" y="290" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="22" fill="#0E1111">:root {</text>
  <text x="1000" y="330" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="22" fill="#5B6461">--color-primary: <tspan fill="#3DD491">#3DD491;</tspan></text><text x="1000" y="374" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="22" fill="#5B6461">--color-on-primary: <tspan fill="#0E1111">#1C1C1C;</tspan></text><text x="1000" y="418" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="22" fill="#5B6461">--radius-control: <tspan fill="#0E1111">6px;</tspan></text><text x="1000" y="462" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="22" fill="#5B6461">--space-1: <tspan fill="#0E1111">8px;</tspan></text><text x="1000" y="506" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="22" fill="#5B6461">--space-2: <tspan fill="#0E1111">16px;</tspan></text>
  <text x="1000" y="550" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="22" fill="#0E1111">}</text>
